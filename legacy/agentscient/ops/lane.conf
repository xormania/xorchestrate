# The tracked configuration for the lane. Bash sources this file; Python reads
# the same deliberately small grammar. Machine-specific overrides belong in
# the gitignored lane.local.conf beside it. State lives below
# ${XDG_STATE_HOME:-$HOME/.local/state}/<LANE_NAME>.

LANE_NAME='agentscient'
TRUNK_BRANCH='dev'
RELEASE_BRANCH='master'
REPO_SLUG='uscient/agentscient'
CHECK_NAMES='lane'
WF_AGENT_DEFAULT='Claude Fable 5.1 <noreply@anthropic.com>'
LANE_AUTHOR='xormania <127287135+xormania@users.noreply.github.com>'
# Worktrees are per project: this lane's live in ../ag-wt, so a tree walk over a
# shared ../wt no longer crosses another repository's worktrees (owner,
# 2026-09-17: "we need to separate worktrees per project - lets use ag-wt
# instead of a shared wt dir").
WORKTREE_ROOT='../ag-wt'
# At every dispatch close the launcher sweeps the store's BACKLOG: jobs that
# closed more than DISPATCH_RECLAIM_DAYS ago lose snapshot/ (a git checkout
# whose head refs/dispatch/<id> holds) and home/ (the harness isolation
# directory). The job that just closed is never touched -- a fresh snapshot is
# what resume resumes from and what a reviewer opens. Evidence -- record.json,
# diff.patch, out/, context/, the streams -- is kept either way, and a job with
# a resumable envelope, an unreachable head or uncaptured residue is kept
# whole. Measured 2026-09-18: 845 jobs held 1,556,838 inodes, 44% of this host,
# and these two directories were 1,525,881 of them, because nothing swept a
# store that lives outside the repository. 'off' disables the sweep entirely.
DISPATCH_RECLAIM='on'
DISPATCH_RECLAIM_DAYS='5'
# The Dispatcher's launch facade (ops/conductor/sessions-lever.md, slice 3):
# the programs it runs, each a repository path run as an argv with no shell,
# and how many launches may be in flight at once. A test names a fake in the
# environment instead.
DISPATCH_WRAPPER='ops/conductor/tools/dispatch.sh'
DISPATCH_LAUNCHER='ops/devlane/dispatch/launch.py'
DISPATCH_MONITOR='ops/conductor/tools/monitor.py'
DISPATCH_CAPACITY='6'
# Read from the environment by the sessions lever, declared here so the
# closure sees them; empty leaves each to its owner's default. TMUX_TMPDIR
# is tmux's socket directory (sessions.py measures the socket path under
# it); XAI_API_KEY selects grok's xai.api_key authentication over its
# cached token (session_adapters/grok.py).
TMUX_TMPDIR=''
XAI_API_KEY=''
CLAUDE_DIR='.claude/projects'
ADDRESS_GROK='noreply@x.ai'
ADDRESS_CODEX='noreply@openai.com'
ADDRESS_CLAUDE='noreply@anthropic.com'
# Worker membership does not admit an unimplemented adapter. Executable
# overrides belong in EXECUTABLE_<NAME>; omitted overrides retain PATH lookup.
WORKER_HARNESSES='claude codex grok agy'
MODEL_GROK='grok-4.7'
MODEL_CODEX='gpt-5.6-sol'
MODEL_CODEX_SECURITY_AUDIT='gpt-daybreak-blue-latest'
MODEL_CLAUDE_READ='claude-opus-5'
MODEL_CLAUDE_PLAN='claude-fable-5-1'
# Effort per job: every job runs at high, planning included (owner,
# 2026-09-13, token thrift #4: the xhigh plan spent 131,632 output tokens
# against the census's 46,398; xhigh or max is the owner's call at dispatch,
# by --effort, never the default). EFFORT_<HARNESS>_<JOB> beats
# EFFORT_<HARNESS> (PR #20); ops/conductor/tests/test_lane_conf_effort_policy.py
# pins this.
EFFORT_GROK='high'
EFFORT_CODEX='high'
EFFORT_CLAUDE='high'
EFFORT_CLAUDE_PLAN='high'
WALL_DEFAULT='900'
SCOPE_CAP='1024'
# Optional pinned Graft installation; absolute host path enables code navigation.
GRAFT_INSTALL=''
# How ledger.py reads the ids already minted. Empty, the default, fetches origin
# and reads every ref, so an id taken on a branch that has not merged is not
# offered again; an origin that cannot be reached refuses class `refs` rather
# than answering off stale refs. 'local' is the operator declaring that the
# answer is off this repository's refs alone and may be low.
LEDGER_REFS=''
