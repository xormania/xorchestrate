[project]
name = "fixture-python-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "python-json-logger>=2.0",
  # The exact sibling is the clean dependency neighbour.
  "python-dotenv==1.0.1",
]

[project.scripts]
fixture-python-service = "service.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
