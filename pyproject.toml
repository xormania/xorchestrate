[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xorchestrate"
version = "0.2.0"
description = "Configurable agent orchestration through ports and adapters"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
telemetry = ["agent-telemetry @ git+https://github.com/xormania/cce.git@84229bb7497547d2db91d02a4633ccb3867f740b#subdirectory=tools/telemetry"]

[project.scripts]
xorchestrate = "xorchestrate.cli:main"

[tool.setuptools.packages.find]
include = ["xorchestrate*"]

[tool.pytest.ini_options]
testpaths = ["tests/hexagonal"]
python_files = ["test_*.py", "*_test.py"]
