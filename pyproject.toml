[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xorchestrate"
version = "0.2.0"
description = "Configurable agent orchestration through ports and adapters"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[dependency-groups]
validation = ["ruff==0.16.8", "build>=1.2,<2", "setuptools>=68", "wheel>=0.45,<1"]

[project.scripts]
xo = "xorchestrate.cli:main"
xorchestrate = "xorchestrate.cli:main"

[tool.setuptools.packages.find]
include = ["xorchestrate*"]

[tool.pytest.ini_options]
testpaths = ["tests/hexagonal"]
python_files = ["test_*.py", "*_test.py"]
