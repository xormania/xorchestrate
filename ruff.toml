target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I"]
# Reviewed security checks; keep policy explicit when the pinned Ruff changes.
extend-select = [
    "S102",  # exec
    "S103",  # permissive chmod
    "S202",  # unsafe archive extraction
    "S301",  # pickle deserialization
    "S306",  # insecure temporary paths
    "S307",  # eval
    "S323",  # unverified TLS context
    "S324",  # weak security hashes
    "S501",  # disabled certificate verification
    "S506",  # unsafe YAML loading
    "S507",  # disabled SSH host-key verification
    "S602",  # subprocess shell execution
    "S604",  # other calls with shell=True
    "S605",  # shell-based process APIs
    "S609",  # wildcard injection in Unix commands
]

[lint.per-file-ignores]
"devtools/run.py" = ["E402"]
"devtools/tests/native_fixture.py" = ["E402"]
