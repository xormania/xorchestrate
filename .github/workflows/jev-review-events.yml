{
  "name": "Jev review event",
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "observe": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "jev-review-event",
            "path": "${{ github.event_path }}",
            "retention-days": 1
          }
        }
      ]
    }
  },
  "on": {
    "pull_request_review": {
      "types": [
        "submitted"
      ]
    }
  }
}
