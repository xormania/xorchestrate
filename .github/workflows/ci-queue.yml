{
  "name": "CI queue cleanup",
  "on": {
    "workflow_run": {
      "workflows": ["CI"],
      "types": ["requested", "in_progress"]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "write",
    "pull-requests": "read"
  },
  "concurrency": {
    "group": "ci-queue-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "cleanup": {
      "if": "github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.head_repository.full_name == github.repository",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "name": "Checkout trusted queue controller",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Revalidate current source and cancel obsolete CI",
          "env": {"GITHUB_TOKEN": "${{ github.token }}"},
          "run": "python3 -I -B scripts/ci/queue.py --output \"$RUNNER_TEMP/ci-queue/report.json\""
        },
        {
          "name": "Retain observed queue decisions",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "ci-queue-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ci-queue/report.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
