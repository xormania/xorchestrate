{
  "name": "CI",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "synchronize",
        "reopened",
        "edited"
      ]
    },
    "push": {
      "branches": [
        "master"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}-{2}-{3}', github.repository_id, github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || github.ref }}",
    "cancel-in-progress": "${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body)) }}"
  },
  "jobs": {
    "paths": {
      "name": "Classify changed paths",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "outputs": {
        "code": "${{ steps.guard.outputs.force == 'false' && steps.classify.outputs.code || 'true' }}",
        "context": "${{ steps.candidate.outputs.context }}",
        "reuse": "${{ steps.reuse.outputs.reuse || 'false' }}",
        "reuse_plan": "${{ steps.reuse.outputs.reuse_plan }}",
        "superseded": "${{ steps.reuse.outputs.superseded || 'false' }}",
        "timings_artifact": "${{ steps.timings-upload.outputs.artifact-id }}",
        "timings_sha256": "${{ steps.timings.outputs.sha256 }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          },
          "id": "checkout"
        },
        {
          "name": "Capture the actual validation candidate",
          "id": "candidate",
          "run": "python3 -I -B scripts/ci/candidate.py context --output \"$RUNNER_TEMP/ci-context/context.json\" --github-output \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Force full validation for classifier and validation changes",
          "id": "guard",
          "shell": "bash",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "PULL_REQUEST_BASE": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "force=true\nchanged=\"$RUNNER_TEMP/xor-changed-paths\"\nif [ \"$EVENT_NAME\" = pull_request ] && [ -n \"$PULL_REQUEST_BASE\" ] \\\n  && git diff --name-only --no-renames -z \"$PULL_REQUEST_BASE\" HEAD -- > \"$changed\" \\\n  && [ -s \"$changed\" ] && tr '\\0' '\\n' < \"$changed\" > \"$changed.lines\"; then\n  status=0\n  grep -Eq '^(scripts/ci/|\\.github/|contracts/|tests/)' \"$changed.lines\" || status=$?\n  case \"$status\" in\n    0) echo \"Classifier or validation definitions changed; forcing full validation\" ;;\n    1) force=false ;;\n    *) echo \"Guard could not inspect changed paths; forcing full validation\" ;;\n  esac\nfi\necho \"force=$force\" >> \"$GITHUB_OUTPUT\"\necho \"force=$force\"\n"
        },
        {
          "name": "Classify documentation-only changes",
          "id": "classify",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "PULL_REQUEST_BASE": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/ci/classify_changes.py --event \"$EVENT_NAME\" --pull-request-base \"$PULL_REQUEST_BASE\" --head HEAD --github-output \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Resolve the pinned Python runtime for evidence compatibility",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.16"
          },
          "continue-on-error": true
        },
        {
          "name": "Resolve the pinned runtime manager for evidence compatibility",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.7",
            "enable-cache": false,
            "checksum": "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          },
          "continue-on-error": true
        },
        {
          "name": "Plan qualified behavioral reuse",
          "id": "reuse",
          "continue-on-error": true,
          "timeout-minutes": 3,
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "CI_REUSE_ENABLED": "${{ vars.CI_REUSE_ENABLED != 'false' }}"
          },
          "run": "python3 -I -B scripts/ci/reuse.py --context \"$RUNNER_TEMP/ci-context/context.json\" --work \"$RUNNER_TEMP/ci-reuse-planning\" --output \"$RUNNER_TEMP/ci-reuse-plan/plan.json\" --github-output \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Retain the lifecycle observation and reuse decision",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "ci-reuse-plan--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/ci-reuse-plan/plan.json",
            "if-no-files-found": "warn",
            "retention-days": 30
          }
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "candidate-context--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/ci-context/context.json",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        },
        {
          "name": "Resolve one shared test timing snapshot",
          "id": "timings",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "TIMINGS_BRANCH": "${{ github.event.repository.default_branch }}"
          },
          "run": "python3 -I -B scripts/ci/timings.py select --root . --context \"$RUNNER_TEMP/ci-context/context.json\" --branch \"$TIMINGS_BRANCH\" --output \"$RUNNER_TEMP/ci-timings\" --github-output \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Retain the shared test timing snapshot",
          "id": "timings-upload",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "ci-test-timing-plan--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/ci-timings/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ],
      "permissions": {
        "contents": "read",
        "actions": "read",
        "checks": "read",
        "pull-requests": "read"
      },
      "if": "${{ always() }}"
    },
    "changes": {
      "name": "Static checks",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\"\nprintf 'UV_PROJECT_ENVIRONMENT=%s\\n' \"$RUNNER_TEMP/xor-validation-python\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.16"
          },
          "id": "python"
        },
        {
          "name": "Install pinned validation runtime manager",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.7",
            "enable-cache": true,
            "cache-dependency-glob": "uv.lock",
            "checksum": "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          }
        },
        {
          "name": "Install pinned linter",
          "run": "python3 -m scripts.ci.dependencies check\nuv sync --locked --only-group validation --no-install-project --managed-python --python 3.12.16\nuv sync --locked --no-default-groups --group validation --no-install-project --managed-python --python 3.12.16\nuv pip install --python \"$UV_PROJECT_ENVIRONMENT/bin/python\" --no-deps --no-build-isolation -e .\necho \"$UV_PROJECT_ENVIRONMENT/bin\" >> \"$GITHUB_PATH\"",
          "id": "dependencies"
        },
        {
          "name": "Bind lane evidence to the captured candidate",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -I -B scripts/ci/candidate.py lane --lane \"static-checks-python-3.12\" --output \"$RUNNER_TEMP/xor-static/producer.json\""
        },
        {
          "name": "Run shared static checks",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite static --output \"$RUNNER_TEMP/xor-static\" --check-timeout 120"
        },
        {
          "name": "Record unavailable static validation",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-static\"\ncat > \"$RUNNER_TEMP/xor-static/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"static\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "static-checks-python-3.12--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/xor-static/**/*.json\n${{ runner.temp }}/xor-static/**/*.log\n${{ runner.temp }}/xor-static/**/*.txt\n!${{ runner.temp }}/xor-static/**/snapshot/**",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ],
      "needs": [
        "paths"
      ],
      "env": {
        "CI_CANDIDATE_CONTEXT": "${{ needs.paths.outputs.context }}"
      },
      "if": "${{ always() && needs.paths.outputs.superseded != 'true' }}"
    },
    "application-tests": {
      "name": "Application tests shard ${{ matrix.shard }}/${{ matrix.shards }} (Python 3.12)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "needs": [
        "paths"
      ],
      "if": "${{ !cancelled() && needs.paths.outputs.code != 'false' && needs.paths.outputs.reuse != 'true' && needs.paths.outputs.superseded != 'true' }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": [
            1,
            2,
            3,
            4,
            5,
            6,
            7,
            8
          ],
          "shards": [
            8
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          },
          "id": "checkout"
        },
        {
          "name": "Read the shared test timing snapshot",
          "id": "timings",
          "uses": "actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131",
          "with": {
            "artifact-ids": "${{ needs.paths.outputs.timings_artifact }}",
            "path": "${{ runner.temp }}/ci-timings"
          }
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\"\nprintf 'UV_PROJECT_ENVIRONMENT=%s\\n' \"$RUNNER_TEMP/xor-validation-python\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.16"
          },
          "id": "python"
        },
        {
          "name": "Install pinned validation runtime manager",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.7",
            "enable-cache": true,
            "cache-dependency-glob": "uv.lock",
            "checksum": "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          }
        },
        {
          "name": "Install application dependencies",
          "run": "python3 -m scripts.ci.dependencies check\nuv sync --locked --only-group validation --no-install-project --managed-python --python 3.12.16\nuv sync --locked --no-default-groups --group validation --no-install-project --managed-python --python 3.12.16 --extra test\nuv pip install --python \"$UV_PROJECT_ENVIRONMENT/bin/python\" --no-deps --no-build-isolation -e .\necho \"$UV_PROJECT_ENVIRONMENT/bin\" >> \"$GITHUB_PATH\"",
          "id": "dependencies"
        },
        {
          "name": "Bind lane evidence to the captured candidate",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -I -B scripts/ci/candidate.py lane --lane \"framework-tests-python-3.12-shard-${{ matrix.shard }}-of-${{ matrix.shards }}\" --output \"$RUNNER_TEMP/xor-checks/producer.json\""
        },
        {
          "name": "Run tests shard ${{ matrix.shard }}/${{ matrix.shards }}",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "printf '%s  %s\\n' \"$CI_TIMINGS_SHA256\" \"$RUNNER_TEMP/ci-timings/timings.json\" | sha256sum --check --status\nmkdir -p \"$RUNNER_TEMP/xor-checks\"\ngit show -s --format='%H%n%T%n%P' HEAD > \"$RUNNER_TEMP/xor-checks/identity.txt\"\npython3 -m scripts.testkit run --suite tests --shard \"${{ matrix.shard }}/${{ matrix.shards }}\" --timings \"$RUNNER_TEMP/ci-timings/timings.json\" --output \"$RUNNER_TEMP/xor-checks/tests\" --check-timeout 600",
          "env": {
            "CI_TIMINGS_SHA256": "${{ needs.paths.outputs.timings_sha256 }}"
          }
        },
        {
          "name": "Record unavailable tests shard",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-checks\"\ncat > \"$RUNNER_TEMP/xor-checks/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"tests\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "framework-tests-python-3.12-shard-${{ matrix.shard }}-of-${{ matrix.shards }}--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/xor-checks/**/*.json\n${{ runner.temp }}/xor-checks/**/*.xml\n${{ runner.temp }}/xor-checks/**/*.log\n${{ runner.temp }}/xor-checks/**/*.txt\n!${{ runner.temp }}/xor-checks/**/snapshot/**\n!${{ runner.temp }}/xor-checks/**/control/**\n!${{ runner.temp }}/xor-checks/**/mutant/**\n!${{ runner.temp }}/xor-checks/**/candidate/**",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ],
      "env": {
        "CI_CANDIDATE_CONTEXT": "${{ needs.paths.outputs.context }}",
        "CI_TIMINGS_REQUIRED": "true"
      }
    },
    "application": {
      "name": "Application and adapter tests (Python 3.12)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "needs": [
        "paths",
        "application-tests"
      ],
      "if": "${{ always() && needs.paths.outputs.code != 'false' && needs.paths.outputs.reuse != 'true' && needs.paths.outputs.superseded != 'true' }}",
      "steps": [
        {
          "name": "Require every tests shard",
          "env": {
            "TESTS_RESULT": "${{ needs.application-tests.result }}"
          },
          "run": "if [ \"$TESTS_RESULT\" != success ]; then\n  echo \"Tests shards did not all pass: $TESTS_RESULT\"\n  exit 1\nfi\necho \"All tests shards passed\""
        }
      ]
    },
    "verification": {
      "name": "Calibration and multi-harness verification",
      "needs": [
        "paths"
      ],
      "if": "${{ !cancelled() && needs.paths.outputs.code != 'false' && needs.paths.outputs.reuse != 'true' && needs.paths.outputs.superseded != 'true' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\"\nprintf 'UV_PROJECT_ENVIRONMENT=%s\\n' \"$RUNNER_TEMP/xor-validation-python\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.16"
          },
          "id": "python"
        },
        {
          "name": "Install pinned validation runtime manager",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.7",
            "enable-cache": true,
            "cache-dependency-glob": "uv.lock",
            "checksum": "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          }
        },
        {
          "name": "Install verification dependencies",
          "run": "python3 -m scripts.ci.dependencies check\nuv sync --locked --only-group validation --no-install-project --managed-python --python 3.12.16\nuv sync --locked --no-default-groups --group validation --no-install-project --managed-python --python 3.12.16 --extra test\nuv pip install --python \"$UV_PROJECT_ENVIRONMENT/bin/python\" --no-deps --no-build-isolation -e .\necho \"$UV_PROJECT_ENVIRONMENT/bin\" >> \"$GITHUB_PATH\"",
          "id": "dependencies"
        },
        {
          "name": "Bind lane evidence to the captured candidate",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -I -B scripts/ci/candidate.py lane --lane \"calibration-python-3.12\" --output \"$RUNNER_TEMP/xor-calibration/producer.json\""
        },
        {
          "name": "Calibrate independent verification through the shared framework",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite calibration --output \"$RUNNER_TEMP/xor-calibration\" --check-timeout 600"
        },
        {
          "name": "Bind lane evidence to the captured candidate",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -I -B scripts/ci/candidate.py lane --lane composed-protocol-evidence --output \"$RUNNER_TEMP/xor-verification/producer.json\""
        },
        {
          "name": "Run composed three-harness protocol acceptance",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite multi-harness --mode protocol-fixture --output \"$RUNNER_TEMP/xor-verification\" --timeout 60"
        },
        {
          "name": "Record unavailable calibration and multi-harness validation",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-calibration\" \"$RUNNER_TEMP/xor-verification\"\ncat > \"$RUNNER_TEMP/xor-calibration/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"calibration\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON\ncat > \"$RUNNER_TEMP/xor-verification/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"multi-harness\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "composed-protocol-evidence--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/xor-verification/**",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "calibration-python-3.12--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/xor-calibration/**/*.json\n${{ runner.temp }}/xor-calibration/**/*.xml\n${{ runner.temp }}/xor-calibration/**/*.log\n${{ runner.temp }}/xor-calibration/**/*.txt\n!${{ runner.temp }}/xor-calibration/**/snapshot/**\n!${{ runner.temp }}/xor-calibration/**/control/**\n!${{ runner.temp }}/xor-calibration/**/mutant/**\n!${{ runner.temp }}/xor-calibration/**/candidate/**",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ],
      "env": {
        "CI_CANDIDATE_CONTEXT": "${{ needs.paths.outputs.context }}"
      }
    },
    "tmux-acceptance": {
      "name": "Tmux live acceptance (protocol fixture)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "needs": [
        "paths"
      ],
      "if": "${{ !cancelled() && needs.paths.outputs.code != 'false' && needs.paths.outputs.reuse != 'true' && needs.paths.outputs.superseded != 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\"\nprintf 'UV_PROJECT_ENVIRONMENT=%s\\n' \"$RUNNER_TEMP/xor-validation-python\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.16"
          },
          "id": "python"
        },
        {
          "name": "Install pinned validation runtime manager",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.7",
            "enable-cache": true,
            "cache-dependency-glob": "uv.lock",
            "checksum": "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          }
        },
        {
          "name": "Install application and tmux",
          "run": "python3 -m scripts.ci.dependencies check\nuv sync --locked --only-group validation --no-install-project --managed-python --python 3.12.16\nuv sync --locked --no-default-groups --group validation --no-install-project --managed-python --python 3.12.16 --extra test\nuv pip install --python \"$UV_PROJECT_ENVIRONMENT/bin/python\" --no-deps --no-build-isolation -e .\necho \"$UV_PROJECT_ENVIRONMENT/bin\" >> \"$GITHUB_PATH\"\nif ! command -v tmux >/dev/null 2>&1; then\n  sudo apt-get update\n  sudo apt-get install -y tmux\nfi\ntmux -V",
          "id": "dependencies"
        },
        {
          "name": "Bind lane evidence to the captured candidate",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -I -B scripts/ci/candidate.py lane --lane \"tmux-acceptance-evidence\" --output \"$RUNNER_TEMP/acceptance-evidence/producer.json\""
        },
        {
          "name": "Run reusable tmux acceptance fixture",
          "run": "python3 -m scripts.testkit run --suite acceptance --mode protocol-fixture --output \"$RUNNER_TEMP/acceptance-evidence\" --timeout 120",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'"
        },
        {
          "name": "Run selectable tmux story battery",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite stories --mode protocol-fixture --output \"$RUNNER_TEMP/acceptance-evidence/stories\" --timeout 60 --run-timeout 240 --max-sessions 2 --max-turns 4 --max-tool-calls 5000"
        },
        {
          "name": "Record unavailable tmux acceptance",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/acceptance-evidence\"\ncat > \"$RUNNER_TEMP/acceptance-evidence/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"acceptance\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "tmux-acceptance-evidence--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/acceptance-evidence/**/report.json\n${{ runner.temp }}/acceptance-evidence/**/scenario.json\n${{ runner.temp }}/acceptance-evidence/**/commands/**/*.json\n${{ runner.temp }}/acceptance-evidence/**/commands/**/*.log\n${{ runner.temp }}/acceptance-evidence/setup.json\n${{ runner.temp }}/acceptance-evidence/**/candidate.json\n${{ runner.temp }}/acceptance-evidence/producer.json",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "env": {
        "CI_CANDIDATE_CONTEXT": "${{ needs.paths.outputs.context }}"
      }
    },
    "architecture-status": {
      "name": "Hexagonal architecture",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "needs": [
        "changes"
      ],
      "if": "${{ always() }}",
      "steps": [
        {
          "name": "Report shared static result",
          "env": {
            "STATIC_RESULT": "${{ needs.changes.result }}"
          },
          "run": "if [ \"$STATIC_RESULT\" != success ]; then\n  echo \"Shared static suite did not pass: $STATIC_RESULT\"\n  exit 1\nfi\necho \"Shared static suite passed, including deterministic architecture enforcement\""
        }
      ]
    },
    "package": {
      "name": "Installed package acceptance",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "needs": [
        "paths"
      ],
      "if": "${{ !cancelled() && needs.paths.outputs.code != 'false' && needs.paths.outputs.reuse != 'true' && needs.paths.outputs.superseded != 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/package-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\"\nprintf 'UV_PROJECT_ENVIRONMENT=%s\\n' \"$RUNNER_TEMP/package-builder\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.7",
            "enable-cache": false,
            "checksum": "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          },
          "id": "uv"
        },
        {
          "name": "Install locked distribution build tools",
          "id": "dependencies",
          "run": "python3 -m scripts.ci.dependencies check\nuv sync --locked --managed-python --python 3.12.16 --no-default-groups --group validation --no-install-project"
        },
        {
          "name": "Bind lane evidence to the captured candidate",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "\"$UV_PROJECT_ENVIRONMENT/bin/python\" -I -B scripts/ci/candidate.py lane --lane \"package-acceptance-evidence\" --output \"$RUNNER_TEMP/package-acceptance/producer.json\""
        },
        {
          "name": "Verify wheel and source distribution consumers",
          "id": "acceptance",
          "run": "\"$UV_PROJECT_ENVIRONMENT/bin/python\" -m scripts.ci.package_acceptance --output \"$RUNNER_TEMP/package-acceptance\""
        },
        {
          "name": "Record unavailable package acceptance",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.uv.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/package-acceptance\"\ncat > \"$RUNNER_TEMP/package-acceptance/report.json\" <<'JSON'\n{\"schema_version\":1,\"status\":\"failed\",\"artifacts\":[],\"error\":{\"stage\":\"setup\",\"message\":\"Package acceptance prerequisites did not succeed\"}}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "package-acceptance-evidence--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/package-acceptance/**/report.json\n${{ runner.temp }}/package-acceptance/**/commands/**\n${{ runner.temp }}/package-acceptance/**/distributions/*\n${{ runner.temp }}/package-acceptance/**/*constraints.txt\n${{ runner.temp }}/package-acceptance/producer.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "env": {
        "CI_CANDIDATE_CONTEXT": "${{ needs.paths.outputs.context }}"
      }
    },
    "ci-result": {
      "name": "CI result",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "needs": [
        "paths",
        "changes",
        "application-tests",
        "application",
        "verification",
        "tmux-acceptance",
        "architecture-status",
        "package"
      ],
      "if": "${{ always() }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          },
          "id": "checkout"
        },
        {
          "name": "Resolve the pinned Python runtime for evidence compatibility",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.16"
          },
          "id": "python"
        },
        {
          "name": "Resolve the pinned runtime manager for evidence compatibility",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.7",
            "enable-cache": false,
            "checksum": "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          },
          "id": "uv"
        },
        {
          "name": "Qualify CI result and summarize retained evidence",
          "if": "always()",
          "env": {
            "JOB_OUTCOMES": "${{ toJSON(needs) }}",
            "EVENT_NAME": "${{ github.event_name }}",
            "SOURCE_SHA": "${{ github.event.pull_request.head.sha || github.sha }}",
            "TESTED_SHA": "${{ github.sha }}",
            "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "GITHUB_TOKEN": "${{ github.token }}",
            "CI_REUSE_PLAN": "${{ needs.paths.outputs.reuse_plan }}"
          },
          "run": "mkdir -p \"$RUNNER_TEMP/ci-result\"\nprintf '%s\\n' \"$JOB_OUTCOMES\" > \"$RUNNER_TEMP/ci-result/needs.json\"\nprintf '%s\\n' \"$CI_CANDIDATE_CONTEXT\" > \"$RUNNER_TEMP/ci-result/context.json\"\nif [ -z \"$CI_REUSE_PLAN\" ]; then\n  CI_REUSE_PLAN='{\"schema_version\":1,\"decision\":\"execute\",\"reason\":\"planning_unavailable\",\"history\":[]}'\nfi\nprintf '%s\\n' \"$CI_REUSE_PLAN\" > \"$RUNNER_TEMP/ci-result/reuse-plan.json\"\ncollection_status=0\npython3 -I -B scripts/ci/candidate.py collect --output \"$RUNNER_TEMP/ci-result/metadata.json\" --artifacts \"$RUNNER_TEMP/ci-result-inputs\" --workflow .github/workflows/ci.yml --needs \"$RUNNER_TEMP/ci-result/needs.json\" || collection_status=$?\npython3 -I -B scripts/ci/result.py --needs \"$RUNNER_TEMP/ci-result/needs.json\" --workflow .github/workflows/ci.yml --catalog contracts/testing.json --artifacts \"$RUNNER_TEMP/ci-result-inputs\" --event \"$EVENT_NAME\" --source-sha \"$SOURCE_SHA\" --tested-sha \"$TESTED_SHA\" --run-url \"$RUN_URL\" --context \"$RUNNER_TEMP/ci-result/context.json\" --metadata \"$RUNNER_TEMP/ci-result/metadata.json\" --reuse-plan \"$RUNNER_TEMP/ci-result/reuse-plan.json\" --summary \"$GITHUB_STEP_SUMMARY\" --output \"$RUNNER_TEMP/ci-result/result.json\"\nexit \"$collection_status\"",
          "id": "qualification"
        },
        {
          "name": "Read the inherited timing snapshot",
          "id": "timings",
          "if": "always()",
          "continue-on-error": true,
          "uses": "actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131",
          "with": {
            "artifact-ids": "${{ needs.paths.outputs.timings_artifact }}",
            "path": "${{ runner.temp }}/ci-timings"
          }
        },
        {
          "name": "Publish qualified test timings for later runs",
          "id": "timings-publish",
          "if": "always()",
          "continue-on-error": true,
          "run": "python3 -I -B scripts/ci/timings.py publish --root . --context \"$RUNNER_TEMP/ci-result/context.json\" --metadata \"$RUNNER_TEMP/ci-result/metadata.json\" --result \"$RUNNER_TEMP/ci-result/result.json\" --artifacts \"$RUNNER_TEMP/ci-result-inputs\" --inherited \"$RUNNER_TEMP/ci-timings\" --output \"$RUNNER_TEMP/ci-next-timings\""
        },
        {
          "name": "Retain test timings for the next CI run",
          "if": "always() && steps.timings-publish.outcome == 'success'",
          "continue-on-error": true,
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "ci-test-timings--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/ci-next-timings/",
            "if-no-files-found": "warn",
            "retention-days": 30
          }
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "ci-result-evidence--attempt-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/ci-result/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ],
      "env": {
        "CI_CANDIDATE_CONTEXT": "${{ needs.paths.outputs.context }}"
      },
      "permissions": {
        "contents": "read",
        "actions": "read",
        "checks": "read",
        "pull-requests": "read"
      }
    }
  },
  "run-name": "CI:${{ github.event_name }}:${{ github.event.action || 'none' }}:${{ github.event.pull_request.number || 0 }}:${{ github.event.pull_request.head.sha || github.sha }}:${{ github.event.pull_request.base.sha || github.sha }}"
}
