{
  "name": "CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "master",
        "integration/hexagonal"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "changes": {
      "name": "Static checks",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install pinned linter",
          "run": "python3 -m pip install --disable-pip-version-check -r .github/requirements-ci.txt"
        },
        {
          "name": "Lint runtime and CI",
          "id": "lint",
          "run": "python3 -m ruff check xorchestrate tests .github scripts"
        },
        {
          "name": "Compile application and fixtures",
          "run": "python3 -m compileall -q xorchestrate tests/hexagonal scripts/testkit scripts/acceptance scripts/verification"
        }
      ]
    },
    "application": {
      "name": "Application and adapter tests (Python ${{ matrix.python }})",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Install application dependencies",
          "run": "python3 -m pip install --disable-pip-version-check -e '.[test]' -r .github/requirements-ci.txt"
        },
        {
          "name": "Run application, boundary, and subprocess integration tests",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-checks\"\ngit show -s --format='%H%n%T%n%P' HEAD > \"$RUNNER_TEMP/xor-checks/identity.txt\"\npython3 -m scripts.testkit run --suite checks --output \"$RUNNER_TEMP/xor-checks/tests\" --check-timeout 600"
        },
        {
          "name": "Calibrate independent verification through the shared framework",
          "if": "matrix.python == '3.12'",
          "run": "python3 -m scripts.testkit run --suite calibration --output \"$RUNNER_TEMP/xor-checks/calibration\" --check-timeout 600"
        },
        {
          "name": "Run composed three-harness protocol acceptance",
          "if": "matrix.python == '3.12'",
          "run": "python3 -m scripts.testkit run --suite multi-harness --mode protocol-fixture --output \"$RUNNER_TEMP/xor-verification\" --timeout 60"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always() && matrix.python == '3.12'",
          "with": {
            "name": "composed-protocol-evidence",
            "path": "${{ runner.temp }}/xor-verification/**",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "framework-checks-python-${{ matrix.python }}",
            "path": "${{ runner.temp }}/xor-checks/**/*.json\n${{ runner.temp }}/xor-checks/**/*.xml\n${{ runner.temp }}/xor-checks/**/*.log\n${{ runner.temp }}/xor-checks/**/*.txt\n!${{ runner.temp }}/xor-checks/**/snapshot/**\n!${{ runner.temp }}/xor-checks/**/control/**\n!${{ runner.temp }}/xor-checks/**/mutant/**\n!${{ runner.temp }}/xor-checks/**/candidate/**",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ],
      "strategy": {
        "matrix": {
          "python": [
            "3.11",
            "3.12"
          ]
        }
      }
    },
    "tmux-acceptance": {
      "name": "Tmux live acceptance (protocol fixture)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install application and tmux",
          "run": "python3 -m pip install --disable-pip-version-check -e '.[test]'\nsudo apt-get update\nsudo apt-get install -y tmux"
        },
        {
          "name": "Run reusable tmux acceptance fixture",
          "run": "python3 -m scripts.testkit run --suite acceptance --mode protocol-fixture --output \"$RUNNER_TEMP/acceptance-evidence\" --timeout 120"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "tmux-acceptance-evidence",
            "path": "${{ runner.temp }}/acceptance-evidence/**/report.json\n${{ runner.temp }}/acceptance-evidence/**/scenario.json",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "architecture": {
      "name": "Hexagonal architecture",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 6,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install test and diagnostic dependencies",
          "run": "python3 -m pip install --disable-pip-version-check -e '.[test]'"
        },
        {
          "name": "Enforce declared hexagonal architecture",
          "id": "deterministic",
          "run": "python3 -m scripts.architecture --output \"$RUNNER_TEMP/architecture/deterministic.json\""
        },
        {
          "name": "Jev architecture diagnostics",
          "if": "always()",
          "env": {
            "TYPESAFE_API_KEY": "${{ secrets.TYPESAFE_API_KEY || secrets.JEV_API_KEY }}",
            "JEV_ENDPOINT": "${{ vars.JEV_ENDPOINT }}",
            "JEV_MODEL": "${{ vars.JEV_MODEL }}"
          },
          "run": "python3 -m scripts.architecture --jev-config contracts/hexagonal-jev.json --diagnostics-only --output \"$RUNNER_TEMP/architecture/diagnostics.json\""
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "architecture-evidence",
            "path": "${{ runner.temp }}/architecture/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
