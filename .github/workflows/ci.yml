{
  "name": "CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "master"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "changes": {
      "name": "Static checks",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          },
          "id": "python"
        },
        {
          "name": "Install pinned linter",
          "run": "python3 -m pip install --disable-pip-version-check -r .github/requirements-ci.txt",
          "id": "dependencies"
        },
        {
          "name": "Run shared static checks",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite static --output \"$RUNNER_TEMP/xor-static\" --check-timeout 120"
        },
        {
          "name": "Record unavailable static validation",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-static\"\ncat > \"$RUNNER_TEMP/xor-static/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"static\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "static-checks-python-3.12",
            "path": "${{ runner.temp }}/xor-static/**/*.json\n${{ runner.temp }}/xor-static/**/*.log\n${{ runner.temp }}/xor-static/**/*.txt\n!${{ runner.temp }}/xor-static/**/snapshot/**",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    },
    "application-tests": {
      "name": "Application tests shard ${{ matrix.shard }}/4 (Python 3.12)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": [
            1,
            2,
            3,
            4
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          },
          "id": "python"
        },
        {
          "name": "Install pinned Python runtime manager",
          "uses": "astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9",
          "with": {
            "version": "0.13.7",
            "enable-cache": false
          }
        },
        {
          "name": "Prepare Python with fixed SQLite WAL support",
          "id": "telemetry-python",
          "run": "uv python install 3.12.16\nuv venv --seed --python 3.12.16 \"$RUNNER_TEMP/xor-telemetry-python\"\necho \"$RUNNER_TEMP/xor-telemetry-python/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Install application dependencies",
          "run": "python3 -m pip install --disable-pip-version-check -e '.[test,telemetry]' -r .github/requirements-ci.txt",
          "id": "dependencies"
        },
        {
          "name": "Run tests shard ${{ matrix.shard }}/4",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-checks\"\ngit show -s --format='%H%n%T%n%P' HEAD > \"$RUNNER_TEMP/xor-checks/identity.txt\"\npython3 -m scripts.testkit run --suite tests --shard \"${{ matrix.shard }}/4\" --output \"$RUNNER_TEMP/xor-checks/tests\" --check-timeout 600"
        },
        {
          "name": "Record unavailable tests shard",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-checks\"\ncat > \"$RUNNER_TEMP/xor-checks/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"tests\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "framework-tests-python-3.12-shard-${{ matrix.shard }}-of-4",
            "path": "${{ runner.temp }}/xor-checks/**/*.json\n${{ runner.temp }}/xor-checks/**/*.xml\n${{ runner.temp }}/xor-checks/**/*.log\n${{ runner.temp }}/xor-checks/**/*.txt\n!${{ runner.temp }}/xor-checks/**/snapshot/**\n!${{ runner.temp }}/xor-checks/**/control/**\n!${{ runner.temp }}/xor-checks/**/mutant/**\n!${{ runner.temp }}/xor-checks/**/candidate/**",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    },
    "calibration": {
      "name": "Calibration and composed protocol (Python 3.12)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          },
          "id": "python"
        },
        {
          "name": "Install pinned Python runtime manager",
          "uses": "astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9",
          "with": {
            "version": "0.13.7",
            "enable-cache": false
          }
        },
        {
          "name": "Prepare Python with fixed SQLite WAL support",
          "id": "telemetry-python",
          "run": "uv python install 3.12.16\nuv venv --seed --python 3.12.16 \"$RUNNER_TEMP/xor-telemetry-python\"\necho \"$RUNNER_TEMP/xor-telemetry-python/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Install application dependencies",
          "run": "python3 -m pip install --disable-pip-version-check -e '.[test,telemetry]' -r .github/requirements-ci.txt",
          "id": "dependencies"
        },
        {
          "name": "Record tested revision",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-checks\"\ngit show -s --format='%H%n%T%n%P' HEAD > \"$RUNNER_TEMP/xor-checks/identity.txt\""
        },
        {
          "name": "Calibrate independent verification through the shared framework",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite calibration --output \"$RUNNER_TEMP/xor-checks/calibration\" --check-timeout 600"
        },
        {
          "name": "Run composed three-harness protocol acceptance",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite multi-harness --mode protocol-fixture --output \"$RUNNER_TEMP/xor-verification\" --timeout 60"
        },
        {
          "name": "Record unavailable calibration and protocol validation",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/xor-checks\"\ncat > \"$RUNNER_TEMP/xor-checks/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"calibration\",\"multi-harness\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "composed-protocol-evidence",
            "path": "${{ runner.temp }}/xor-verification/**",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "framework-checks-python-3.12",
            "path": "${{ runner.temp }}/xor-checks/**/*.json\n${{ runner.temp }}/xor-checks/**/*.xml\n${{ runner.temp }}/xor-checks/**/*.log\n${{ runner.temp }}/xor-checks/**/*.txt\n!${{ runner.temp }}/xor-checks/**/snapshot/**\n!${{ runner.temp }}/xor-checks/**/control/**\n!${{ runner.temp }}/xor-checks/**/mutant/**\n!${{ runner.temp }}/xor-checks/**/candidate/**",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    },
    "application": {
      "name": "Application and adapter tests (Python 3.12)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "needs": [
        "application-tests",
        "calibration"
      ],
      "if": "always()",
      "steps": [
        {
          "name": "Require every tests shard, calibration and protocol suite",
          "env": {
            "TESTS_RESULT": "${{ needs.application-tests.result }}",
            "CALIBRATION_RESULT": "${{ needs.calibration.result }}"
          },
          "run": "status=0\nif [ \"$TESTS_RESULT\" != success ]; then\n  echo \"Tests shards did not all pass: $TESTS_RESULT\"\n  status=1\nfi\nif [ \"$CALIBRATION_RESULT\" != success ]; then\n  echo \"Calibration and composed protocol suites did not pass: $CALIBRATION_RESULT\"\n  status=1\nfi\nif [ \"$status\" = 0 ]; then\n  echo \"All tests shards, calibration and composed protocol suites passed\"\nfi\nexit \"$status\""
        }
      ]
    },
    "tmux-acceptance": {
      "name": "Tmux live acceptance (protocol fixture)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          },
          "id": "python"
        },
        {
          "name": "Install application and tmux",
          "run": "python3 -m pip install --disable-pip-version-check -e '.[test]'\nsudo apt-get update\nsudo apt-get install -y tmux",
          "id": "dependencies"
        },
        {
          "name": "Run reusable tmux acceptance fixture",
          "run": "python3 -m scripts.testkit run --suite acceptance --mode protocol-fixture --output \"$RUNNER_TEMP/acceptance-evidence\" --timeout 120",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'"
        },
        {
          "name": "Run selectable tmux story battery",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "run": "python3 -m scripts.testkit run --suite stories --mode protocol-fixture --output \"$RUNNER_TEMP/acceptance-evidence/stories\" --timeout 60 --run-timeout 240 --max-sessions 2 --max-turns 4 --max-tool-calls 5000"
        },
        {
          "name": "Record unavailable tmux acceptance",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/acceptance-evidence\"\ncat > \"$RUNNER_TEMP/acceptance-evidence/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"selected_suites\":[\"acceptance\"],\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "tmux-acceptance-evidence",
            "path": "${{ runner.temp }}/acceptance-evidence/**/report.json\n${{ runner.temp }}/acceptance-evidence/**/scenario.json\n${{ runner.temp }}/acceptance-evidence/**/commands/**/*.json\n${{ runner.temp }}/acceptance-evidence/**/commands/**/*.log\n${{ runner.temp }}/acceptance-evidence/setup.json",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "architecture-status": {
      "name": "Hexagonal architecture",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "needs": [
        "changes"
      ],
      "if": "always()",
      "steps": [
        {
          "name": "Report shared static result",
          "env": {
            "STATIC_RESULT": "${{ needs.changes.result }}"
          },
          "run": "if [ \"$STATIC_RESULT\" != success ]; then\n  echo \"Shared static suite did not pass: $STATIC_RESULT\"\n  exit 1\nfi\necho \"Shared static suite passed, including deterministic architecture enforcement\""
        }
      ]
    },
    "architecture": {
      "name": "Jev architecture diagnostics",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 6,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          },
          "id": "checkout"
        },
        {
          "name": "Configure external Python cache",
          "id": "cache",
          "run": "python_cache_dir=\"$(mktemp -d \"$RUNNER_TEMP/xorchestrate-python-cache.XXXXXX\")\"\nprintf 'PYTHONPYCACHEPREFIX=%s\\n' \"$python_cache_dir\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          },
          "id": "python"
        },
        {
          "name": "Install test and diagnostic dependencies",
          "run": "python3 -m pip install --disable-pip-version-check -e '.[test]'",
          "id": "dependencies"
        },
        {
          "name": "Jev architecture diagnostics",
          "if": "!cancelled() && steps.checkout.outcome == 'success' && steps.cache.outcome == 'success' && steps.python.outcome == 'success' && steps.dependencies.outcome == 'success'",
          "env": {
            "TYPESAFE_API_KEY": "${{ secrets.TYPESAFE_API_KEY || secrets.JEV_API_KEY }}",
            "JEV_ENDPOINT": "${{ vars.JEV_ENDPOINT }}",
            "JEV_MODEL": "${{ vars.JEV_MODEL }}"
          },
          "run": "python3 -m scripts.architecture --jev-config contracts/hexagonal-jev.json --diagnostics-only --output \"$RUNNER_TEMP/architecture/diagnostics.json\""
        },
        {
          "name": "Record unavailable diagnostics",
          "if": "!cancelled() && (steps.checkout.outcome != 'success' || steps.cache.outcome != 'success' || steps.python.outcome != 'success' || steps.dependencies.outcome != 'success')",
          "run": "mkdir -p \"$RUNNER_TEMP/architecture\"\ncat > \"$RUNNER_TEMP/architecture/setup.json\" <<'JSON'\n{\"status\":\"setup_error\",\"launched\":false,\"reason\":\"CI checkout, cache, interpreter or dependency setup did not succeed\"}\nJSON"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "architecture-evidence",
            "path": "${{ runner.temp }}/architecture/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
