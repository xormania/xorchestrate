{
  "name": "Project PHP runtime",
  "description": "Install checksum-pinned PHP and Composer from the retained GitHub release on Linux/X64.",
  "runs": {
    "using": "composite",
    "steps": [
      {
        "name": "Install retained PHP and Composer",
        "shell": "bash",
        "env": {
          "CI_PHP_ACTION_PATH": "${{ github.action_path }}",
          "GH_TOKEN": "${{ github.token }}"
        },
        "run": "python3 \"$CI_PHP_ACTION_PATH/toolchain.py\" install"
      },
      {
        "name": "Locate hosted Composer download cache",
        "id": "composer-cache",
        "if": "${{ runner.environment == 'github-hosted' }}",
        "shell": "bash",
        "run": "printf 'path=%s\\n' \"$(composer config cache-files-dir)\" >> \"$GITHUB_OUTPUT\""
      },
      {
        "name": "Cache hosted Composer downloads",
        "if": "${{ runner.environment == 'github-hosted' }}",
        "uses": "actions/cache@caa296126883cff596d87d8935842f9db880ef25",
        "with": {
          "path": "${{ steps.composer-cache.outputs.path }}",
          "key": "composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}",
          "restore-keys": "composer-${{ runner.os }}-${{ runner.arch }}-"
        }
      }
    ]
  }
}
