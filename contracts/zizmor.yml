rules:
  dangerous-triggers:
    ignore:
      # The trusted queue controller never executes candidate code and revalidates identities before cancellation.
      - ci-queue.yml:4
      # These handlers run trusted default-branch code and collect only bounded event evidence.
      - jev-events.yml:85
      - jev-events.yml:94
      - jev.yml:4
  github-env:
    # These writes use fixed runner-temporary paths and trusted commit-SHA values.
    ignore:
      - jev-events.yml:31
      - jev.yml:58
      - jev.yml:72
